name: Utforska Livsmedelsverkets API (tillfällig)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  utforska:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta exempel och spara i grenen utforskning
        run: |
          mkdir ut && cd ut
          B=https://dataportal.livsmedelsverket.se/livsmedel
          curl -sS -m 30 "$B/swagger/v1/swagger.json" -o swagger.json -w "%{http_code}\n" > koder.txt || true
          curl -sS -m 30 "$B/api/v1/livsmedel?offset=0&limit=3&sprak=1" -o lista.json -w "%{http_code}\n" >> koder.txt || true
          curl -sS -m 30 "$B/api/v1/livsmedel/1/naringsvarden?sprak=1" -o naring1.json -w "%{http_code}\n" >> koder.txt || true
          ls -la; cat koder.txt
          git init -q && git checkout -q -b utforskning && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Utforskning"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" utforskning
